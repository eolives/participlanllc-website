        '<a class="btn secondary" href="' + EXPLORER_URL + '" target="_blank" rel="noopener">Explore the full Charter</a>' +
        '<button class="btn secondary" id="share-btn">Copy my result</button>' +
      '</div>' +
    '</div>';

  document.getElementById('retake-btn').addEventListener('click', startQuiz);
  document.getElementById('share-btn').addEventListener('click', function(){
    var text = 'I scored ' + state.score + '/' + state.quizSet.length + ' on the Biddeford Charter Quiz and earned the title "' + title.emoji + ' ' + title.name + '." Think you know your city better? Take the quiz yourself.';
    if(navigator.clipboard){
      navigator.clipboard.writeText(text).then(function(){
        var btn = document.getElementById('share-btn');
        var old = btn.textContent; btn.textContent = 'Copied ✓';
        setTimeout(function(){ btn.textContent = old; }, 1600);
      });
    }
  });
}

// ---------- stats dashboard (?stats=1) ----------
function questionLookup(){
  var m = {};
  DATA.questions.forEach(function(q){ m[q.id] = q; });
  return m;
}

async function renderStatsDashboard(){
  app.innerHTML = '<div class="screen"><p class="empty-dash">Loading stats…</p></div>';
  var stats = await fetchRealStats();

  if(!stats || !stats.totalAttempts){
    app.innerHTML =
      '<div class="screen">' +
        '<div class="empty-dash">' +
          (STATS_JSON_URL
            ? 'No attempts recorded yet — ' + escapeHtml(STATS_JSON_URL) + ' exists but is empty, or hasn\'t been created yet.'
            : 'Stats tracking isn\'t configured for this deployment (no STATS_JSON_URL was set at build time).') +
        '</div>' +
        '<div class="btn-row"><a class="btn secondary" href="?">← Back to the quiz</a></div>' +
      '</div>';
    return;
  }

  var qLookup = questionLookup();

  // score distribution, 0-10
  var maxCount = 0;
  for(var s = 0; s <= 10; s++){ maxCount = Math.max(maxCount, stats.scoreDistribution[String(s)] || 0); }
  var histBars = '';
  for(var s2 = 0; s2 <= 10; s2++){
    var count = stats.scoreDistribution[String(s2)] || 0;
    var pct = maxCount > 0 ? Math.round((count / maxCount) * 100) : 0;
    histBars += '<div class="bar-wrap"><div class="bar" style="height:' + Math.max(pct, count > 0 ? 4 : 0) + '%" title="' + count + ' attempt' + (count===1?'':'s') + ' scored ' + s2 + '/10"></div><div class="bar-label">' + s2 + '</div></div>';
  }

  // theme breakdown
  var themeRows = Object.keys(stats.themes).sort().map(function(k){
    var t = DATA.themes[k];
    var d = stats.themes[k];
    var pct = d.seen > 0 ? Math.round((d.correct / d.seen) * 100) : 0;
    return '<div class="tb-row"><span class="tb-name">' + (t ? t.icon + ' ' + escapeHtml(t.name) : 'Theme ' + k) + '</span><span class="tb-bar"><div style="width:' + pct + '%"></div></span><span class="tb-score">' + pct + '%</span></div>';
  }).join('');

  // per-question accuracy, hardest (lowest %) first
  var qRows = Object.keys(stats.questions).map(function(k){
    var d = stats.questions[k];
    var q = qLookup[k];
    var pct = d.seen > 0 ? Math.round((d.correct / d.seen) * 100) : 0;
    return { id: k, pct: pct, seen: d.seen, citation: q ? q.citation : '', text: q ? q.q : ('Question ' + k) };
  }).sort(function(a, b){ return a.pct - b.pct; });

  var qRowsHtml = qRows.map(function(r){
    return '<div class="q-row"><span class="q-cite">' + escapeHtml(r.citation) + '</span><span class="q-text">' + escapeHtml(r.text) + '</span><span class="q-pct">' + r.pct + '% · n=' + r.seen + '</span></div>';
  }).join('');

  app.innerHTML =
    '<div class="screen">' +
      '<div class="dash-header">' +
        '<h1>Quiz stats</h1>' +
        '<p class="dash-meta">' + stats.totalAttempts + ' total attempt' + (stats.totalAttempts===1?'':'s') + ' · last updated ' + (stats.lastUpdated ? new Date(stats.lastUpdated).toLocaleString() : 'never') + '</p>' +
      '</div>' +
      '<div class="dash-section"><h2>Score distribution</h2><div class="hist">' + histBars + '</div></div>' +
      '<div class="dash-section"><h2>Accuracy by theme</h2><div class="theme-breakdown">' + themeRows + '</div></div>' +
      '<div class="dash-section"><h2>Accuracy by question (hardest first)</h2><div class="q-list">' + qRowsHtml + '</div></div>' +
      '<div class="btn-row"><a class="btn secondary" href="?">← Back to the quiz</a></div>' +
    '</div>';
}

var initialParams = new URLSearchParams(location.search);
if(initialParams.get('stats') === '1'){
  renderStatsDashboard();
} else {
  renderLanding();
}
})();
</script>
